# Runs the whole test suite once a day with the nightly flag enabled (tests:nightly=true), which
# turns on the [Nightly] tests (large or slow data, stress and concurrency tests) and makes the
# tests that always run do more work. See #1504.
#
# Unlike the pull request workflows generated by Generate-TestWorkflows.ps1, which run one shard
# per job, each job here builds every test project that supports its target framework and then
# runs them all in parallel, the same way the Azure DevOps nightly build does. That keeps the
# number of concurrent jobs well under the ASF limit while paying the setup cost once per job.
#
# This file is maintained by hand; it is not generated by Generate-TestWorkflows.ps1.

name: 'Lucene.Net Nightly Tests'

on:
  schedule:
    - cron: '0 3 * * *' # Every day at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:

  Test:
    # Scheduled runs only happen on the main repository, but a fork can still run this manually.
    if: ${{ github.event_name != 'schedule' || github.repository == 'apache/lucenenet' }}
    name: Test ${{ matrix.framework }},${{ matrix.platform }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # The Azure DevOps nightly jobs take 25-45 minutes, so this is a cap on a stuck job rather
    # than a budget to run within. The GitHub default is 360 minutes.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, framework: net10.0, platform: x64 }
          - { os: windows-latest, framework: net8.0, platform: x64 }
          - { os: windows-latest, framework: net48, platform: x64 }
          - { os: windows-latest, framework: net472, platform: x64 }
          - { os: ubuntu-latest, framework: net10.0, platform: x64 }
          - { os: ubuntu-latest, framework: net8.0, platform: x64 }
          - { os: macos-latest, framework: net10.0, platform: arm64 }
          - { os: macos-latest, framework: net8.0, platform: arm64 }
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      BUILD_FOR_ALL_TEST_TARGET_FRAMEWORKS: 'true'
      # Set the Azure DevOps default working directory env variable, so our tests only need to deal with a single env variable
      SYSTEM_DEFAULTWORKINGDIRECTORY: ${{ github.workspace }}
      configuration: 'Release'
      test_results_artifact_name: 'nightly_testresults_${{ matrix.os }}_${{ matrix.framework }}_${{ matrix.platform }}'
      trx_file_name: 'TestResults.trx'
      md_file_name: 'TestResults.md' # Report file name for LiquidTestReports.Markdown

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Nightly tests such as Test4GBStoredFields write well over 10GB to the temp directory, which, alongside
      # the other test projects running in parallel, can fill the hosted agent's disk. Remove large toolchains
      # that the build doesn't use to make room. The .NET SDKs are left alone.
      - name: Free Disk Space
        if: ${{ runner.os == 'Linux' }}
        run: |
          echo "Disk space before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          echo "Disk space after cleanup:"
          df -h /
        shell: bash

      - name: Free Disk Space
        if: ${{ runner.os == 'macOS' }}
        run: |
          echo "Disk space before cleanup:"
          df -h /
          rm -rf "$HOME/Library/Android/sdk" || true
          echo "Disk space after cleanup:"
          df -h /
        shell: bash

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: '8.0.x'
        if: ${{ startswith(matrix.framework, 'net8.') }}

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@9a946fdbd5fb07b82b2f5a4466058b876ab72bb2 # v5.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          # '**/*.*proj' includes .csproj, .vbproj, .fsproj, msbuildproj, etc.
          # '**/*.props' includes Directory.Packages.props, Directory.Build.props and Dependencies.props
          # '**/*.targets' includes Directory.Build.targets
          # '**/*.sln' and '*.sln' ensure root solution files are included (minimatch glitch for file extension .sln)
          # 'global.json' included for SDK version changes
          key: nuget-${{ runner.os }}-${{ env.BUILD_FOR_ALL_TEST_TARGET_FRAMEWORKS }}-${{ hashFiles('**/*.*proj', '**/*.props', '**/*.targets', '**/*.sln', '*.sln', 'global.json') }}
          path: ${{ env.NUGET_PACKAGES }}

      - name: Restore
        run: dotnet restore /p:TestFrameworks=${{ env.BUILD_FOR_ALL_TEST_TARGET_FRAMEWORKS }}

      # Same selection as Generate-TestWorkflows.ps1: every test project in a directory whose name
      # contains ".Tests" that supports the target framework of this job.
      - name: Find Test Projects
        run: |
          $framework = '${{ matrix.framework }}'
          $projects = Get-ChildItem -Path "$env:GITHUB_WORKSPACE/src" -Filter '*.csproj' -Recurse |
              Where-Object { $_.Directory.Name.Contains('.Tests') } |
              Sort-Object -Property FullName
          $selected = foreach ($project in $projects) {
              # With more than one -getProperty, MSBuild prints the evaluated values as JSON.
              $output = dotnet msbuild "$($project.FullName)" -nologo -getProperty:IsTestProject -getProperty:TargetFramework -getProperty:TargetFrameworks -p:TestFrameworks=${{ env.BUILD_FOR_ALL_TEST_TARGET_FRAMEWORKS }} 2>&1 | Out-String
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to evaluate project: $($project.FullName)$([System.Environment]::NewLine)$output"
              }
              $properties = ($output | ConvertFrom-Json).Properties
              if ("$($properties.IsTestProject)".Trim() -ne 'true') { continue }
              $targetFrameworks = @("$($properties.TargetFramework)") + ("$($properties.TargetFrameworks)" -split ';') |
                  ForEach-Object { $_.Trim() } | Where-Object { $_ }
              if ($targetFrameworks -contains $framework) {
                  $project.FullName
              }
          }
          $selected = [string[]]@($selected)
          Write-Host "Found $($selected.Count) test projects for ${framework}:"
          $selected | ForEach-Object { Write-Host "  $_" }
          [System.IO.File]::WriteAllLines("$env:RUNNER_TEMP/test-projects.txt", $selected)
        shell: pwsh

      # Tests for lucene-cli depend on the NuGet package for testing
      - name: Pack lucene-cli
        if: ${{ !startswith(matrix.framework, 'net4') }}
        run: dotnet pack "./src/dotnet/tools/lucene-cli/lucene-cli.csproj" --configuration "${{ env.configuration }}" --no-restore -p:TestFrameworks=${{ env.BUILD_FOR_ALL_TEST_TARGET_FRAMEWORKS }} -p:PortableDebugTypeOnly=true
        shell: bash

      # Build the projects one at a time; the shared dependencies are only compiled by the first
      # project that needs them. A project that fails to build is reported and skipped by the
      # test step, so the rest of the suite still runs.
      - name: Build
        run: |
          $framework = '${{ matrix.framework }}'
          $failed = [System.Collections.Generic.List[string]]::new()
          $built = foreach ($project in Get-Content -Path "$env:RUNNER_TEMP/test-projects.txt") {
              Write-Host "::group::Build $([System.IO.Path]::GetFileNameWithoutExtension($project))"
              # Out-Host keeps the build output from being collected into $built.
              dotnet build "$project" --configuration "$env:configuration" --framework "$framework" --no-restore -p:TestFrameworks=${{ env.BUILD_FOR_ALL_TEST_TARGET_FRAMEWORKS }} | Out-Host
              $exitCode = $LASTEXITCODE
              Write-Host "::endgroup::"
              if ($exitCode -eq 0) {
                  $project
              } else {
                  Write-Host "::error::Build failed for $project"
                  $failed.Add($project)
              }
          }
          [System.IO.File]::WriteAllLines("$env:RUNNER_TEMP/built-test-projects.txt", [string[]]@($built))
          [System.IO.File]::WriteAllLines("$env:RUNNER_TEMP/failed-test-projects.txt", [string[]]@($failed))
          # Fail the job at the end of the test step instead, so the projects that did build still get tested.
          exit 0
        shell: pwsh

      - name: Test
        run: |
          $framework = '${{ matrix.framework }}'
          $platform = '${{ matrix.platform }}'
          $resultsRoot = Join-Path $env:GITHUB_WORKSPACE $env:test_results_artifact_name
          New-Item -ItemType Directory -Path $resultsRoot -Force | Out-Null

          # Passing TestRunParameters through a runsettings file avoids quoting differences between shells.
          $runSettingsPath = Join-Path $env:RUNNER_TEMP 'nightly.runsettings'
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <RunSettings>
            <RunConfiguration>
              <TargetPlatform>$platform</TargetPlatform>
            </RunConfiguration>
            <NUnit>
              <DisplayName>FullName</DisplayName>
            </NUnit>
            <TestRunParameters>
              <Parameter name="tests:nightly" value="true" />
              <Parameter name="tests:slow" value="true" />
            </TestRunParameters>
          </RunSettings>
          "@ | Set-Content -Path $runSettingsPath -Encoding utf8

          $projects = @(Get-Content -Path "$env:RUNNER_TEMP/built-test-projects.txt" | Where-Object { $_ })
          $buildFailures = @(Get-Content -Path "$env:RUNNER_TEMP/failed-test-projects.txt" | Where-Object { $_ })

          # Each test project runs in its own process; run as many at once as the agent has cores.
          $throttleLimit = [System.Environment]::ProcessorCount
          Write-Host "Running $($projects.Count) test projects on $framework, $throttleLimit at a time..."

          $results = $projects | ForEach-Object -ThrottleLimit $throttleLimit -Parallel {
              $project = $_
              $framework = $using:framework
              $platform = $using:platform
              $runSettingsPath = $using:runSettingsPath
              $projectName = [System.IO.Path]::GetFileNameWithoutExtension($project)
              $resultDirectory = Join-Path $using:resultsRoot $projectName
              New-Item -ItemType Directory -Path $resultDirectory -Force | Out-Null
              $title = "Test Results for $projectName - $framework - $platform - $env:RUNNER_OS"
              $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
              dotnet test "$project" --configuration "$env:configuration" --framework "$framework" --no-build --no-restore `
                  --settings "$runSettingsPath" `
                  --blame-hang --blame-hang-dump-type mini --blame-hang-timeout 40minutes `
                  --logger:"console;verbosity=normal" `
                  --logger:"trx;LogFileName=$env:trx_file_name" `
                  --logger:"liquid.md;LogFileName=$env:md_file_name;Title=$title;" `
                  --results-directory:"$resultDirectory" *> (Join-Path $resultDirectory 'dotnet-test.log')
              $exitCode = $LASTEXITCODE
              $stopwatch.Stop()
              $outcome = if ($exitCode -eq 0) { 'Passed' } else { 'Failed' }
              Write-Host "$outcome $projectName (exit code $exitCode) in $($stopwatch.Elapsed.ToString('hh\:mm\:ss'))"
              [pscustomobject]@{
                  Name = $projectName
                  ExitCode = $exitCode
                  Duration = $stopwatch.Elapsed
                  ResultDirectory = $resultDirectory
              }
          }

          # Summarize each project from its TRX counters.
          $summary = [System.Text.StringBuilder]::new()
          [void]$summary.AppendLine("## Nightly Test Results - $framework - $platform - $env:RUNNER_OS")
          [void]$summary.AppendLine()
          [void]$summary.AppendLine('| Project | Result | Passed | Failed | Skipped | Duration |')
          [void]$summary.AppendLine('|---|---|---:|---:|---:|---:|')
          foreach ($project in $buildFailures) {
              [void]$summary.AppendLine("| $([System.IO.Path]::GetFileNameWithoutExtension($project)) | :x: Build failed | | | | |")
          }
          $failedProjects = [System.Collections.Generic.List[object]]::new()
          foreach ($result in $results | Sort-Object -Property Name) {
              $passed = ''; $failed = ''; $skipped = ''
              $trxPath = Join-Path $result.ResultDirectory $env:trx_file_name
              if (Test-Path $trxPath) {
                  $counters = ([xml](Get-Content -Path $trxPath -Raw)).TestRun.ResultSummary.Counters
                  $passed = $counters.passed
                  $failed = $counters.failed
                  $skipped = [int]$counters.total - [int]$counters.executed
              }
              $outcome = if ($result.ExitCode -eq 0) { ':white_check_mark: Passed' } elseif (Test-Path $trxPath) { ':x: Failed' } else { ':x: Crashed' }
              if ($result.ExitCode -ne 0) { $failedProjects.Add($result) }
              [void]$summary.AppendLine("| $($result.Name) | $outcome | $passed | $failed | $skipped | $($result.Duration.ToString('hh\:mm\:ss')) |")
          }
          $summary.ToString() | Add-Content -Path $env:GITHUB_STEP_SUMMARY

          # Show the full output and report of the projects that failed.
          foreach ($result in $failedProjects) {
              $log = Join-Path $result.ResultDirectory 'dotnet-test.log'
              Write-Host "::group::Output of $($result.Name)"
              if (Test-Path $log) { Get-Content -Path $log }
              Write-Host "::endgroup::"
              Write-Host "::error::Tests failed for $($result.Name) (exit code $($result.ExitCode))"
              $mdFile = Join-Path $result.ResultDirectory $env:md_file_name
              if (Test-Path $mdFile) {
                  Get-Content -Path $mdFile | Add-Content -Path $env:GITHUB_STEP_SUMMARY
              }
          }

          if ($buildFailures.Count -gt 0 -or $failedProjects.Count -gt 0) {
              Write-Host "$($buildFailures.Count) project(s) failed to build and $($failedProjects.Count) project(s) failed their tests."
              exit 1
          }
        shell: pwsh

      # upload reports as build artifacts
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: '${{ env.test_results_artifact_name }}'
          path: '${{ github.workspace }}/${{ env.test_results_artifact_name }}'
